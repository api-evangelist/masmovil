description: >-
  Masmovil (MasMovil Group) is a Spanish telecommunications operator providing
  mobile, fiber optic internet, and fixed-line services to consumers and
  businesses across Spain, with bundled fiber-plus-mobile packages, device
  sales, roaming, and international calling. The group operates a family of
  consumer telecom brands and, following its 2024 combination with Orange Spain,
  is part of the MasOrange joint venture. As of this enrichment pass Masmovil
  publishes no public developer portal, API documentation, or machine-readable
  API specification; the network profile carries the identity and a domain
  security posture probe only.
